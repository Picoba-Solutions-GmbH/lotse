<div class="flex flex-col gap-5" (keydown.enter)="onLogin()">
  <div class="flex flex-col gap-1.5">
    <label for="username" class="text-sm font-medium text-gray-700 dark:text-gray-300">Username</label>
    <input id="username" type="text" pInputText class="w-full" [(ngModel)]="username" autofocus />
  </div>
  <div class="flex flex-col gap-1.5">
    <label for="password" class="text-sm font-medium text-gray-700 dark:text-gray-300">Password</label>
    <input id="password" type="password" pInputText class="w-full" [(ngModel)]="password" />
  </div>
  @if (errorMessage) {
  <div
    class="flex items-center gap-2 px-3 py-2 rounded-lg bg-red-50 dark:bg-red-900/20 border border-red-200 dark:border-red-800">
    <i class="pi pi-exclamation-circle text-red-500" style="font-size:13px"></i>
    <span class="text-xs text-red-600 dark:text-red-400">{{ errorMessage }}</span>
  </div>
  }
  <div class="flex justify-end gap-3 pt-1">
    <p-button label="Cancel" (onClick)="onCancel()" outlined [disabled]="isLoading" />
    <p-button label="Login" (onClick)="onLogin()" [loading]="isLoading" />
  </div>
</div>
