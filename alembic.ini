# Alembic configuration (database migrations, similar to Entity Framework migrations).
# The database URL is not configured here, it is taken from src/utils/config.py (POSTGRES_* env vars).
#
#   Create a migration from model changes:  alembic revision --autogenerate -m "add something"
#   Apply all pending migrations:           alembic upgrade head    (also done automatically on startup)
#   Revert the last migration:              alembic downgrade -1
#   Show migrations / current state:        alembic history --verbose / alembic current

[alembic]
script_location = %(here)s/migrations
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s
prepend_sys_path = .
version_path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
